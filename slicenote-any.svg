<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 1. 外层圆角正方形（纯白背景填充，黑色描边） -->
  <rect 
    x="25" 
    y="25" 
    width="450" 
    height="450" 
    rx="95" 
    ry="95" 
    fill="#ffffff" 
    stroke="#000000" 
    stroke-width="12" 
    stroke-linejoin="round" 
  />

  <!-- 2. 方框正中央黑点 (中心坐标 250, 250，半径 16px) -->
  <circle 
    cx="250" 
    cy="250" 
    r="16" 
    fill="#000000" 
  />
</svg>
