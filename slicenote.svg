<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 1. 白色镂空背景：外层圆角矩形与倒三角形成复合路径，内部完全透明 -->
  <path 
    d="M 120 25 
       L 380 25 
       A 95 95 0 0 1 475 120 
       L 475 380 
       A 95 95 0 0 1 380 475 
       L 120 475 
       A 95 95 0 0 1 25 380 
       L 25 120 
       A 95 95 0 0 1 120 25 
       Z 
       M 118 125 
       L 382 125 
       L 382 150 
       L 250 215 
       L 118 150 
       Z" 
    fill="#ffffff" 
    fill-rule="evenodd" 
  />

  <!-- 2. 外框黑色轮廓 -->
  <rect 
    x="25" 
    y="25" 
    width="450" 
    height="450" 
    rx="95" 
    ry="95" 
    fill="none" 
    stroke="#000000" 
    stroke-width="12" 
    stroke-linejoin="round" 
  />

  <!-- 3. 中心黑点 (中心坐标 250, 250，半径 16px) -->
  <circle 
    cx="250" 
    cy="250" 
    r="16" 
    fill="#000000" 
  />

  <!-- 4. 倒三角边缘黑色轮廓 -->
  <polygon 
    points="118,125 382,125 382,150 250,215 118,150" 
    fill="none" 
    stroke="#000000" 
    stroke-width="12" 
    stroke-linejoin="round" 
    stroke-linecap="round" 
  />
</svg>
