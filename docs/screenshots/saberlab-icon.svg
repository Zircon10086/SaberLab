<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>SaberLab</title>
  <!-- A note, cut clean through the tip of its arrow: the red and blue halves are the two
       hands (and SABER / LAB in the wordmark), sliding apart along the cut as the saber
       passes. The arrow is the game's solid wedge: the slice-note outline of
       frontend/app.js (SLICE_NOTE_ARROW), scaled with the body (450 -> 184 units).
       Master copy: site/ carries an identical copy, and the .ico / .png renders are
       generated from it (docs/DEVELOPMENT.md §11). -->
  <defs>
    <linearGradient id="sl-red" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ff6b80"/>
      <stop offset="1" stop-color="#d9173d"/>
    </linearGradient>
    <linearGradient id="sl-blue" x1="0.4" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cb3ff"/>
      <stop offset="1" stop-color="#1759d6"/>
    </linearGradient>
    <linearGradient id="sl-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sl-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff"/>
      <stop offset="0.88" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sl-glow" x="-3" y="-0.2" width="7" height="1.4">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="sl-left"><rect x="0" y="0" width="128" height="256"/></clipPath>
    <clipPath id="sl-right"><rect x="128" y="0" width="128" height="256"/></clipPath>
  </defs>

  <!-- the saber, seen in the cut and past the note -->
  <rect x="118" y="12" width="20" height="232" rx="10" fill="#8cc4ff" opacity="0.8" filter="url(#sl-glow)"/>
  <rect x="126" y="12" width="4" height="232" rx="2" fill="url(#sl-blade)"/>

  <!-- left half -->
  <g transform="translate(-9 -11)" clip-path="url(#sl-left)">
    <rect x="36" y="36" width="184" height="184" rx="35" fill="url(#sl-red)"/>
    <rect x="36" y="36" width="184" height="184" rx="35" fill="url(#sl-sheen)"/>
    <polygon points="74,76.9 182,76.9 182,87.1 128,113.7 74,87.1" fill="#fff4f6" stroke="#fff4f6" stroke-width="4.9" stroke-linejoin="round"/>
  </g>

  <!-- right half -->
  <g transform="translate(9 11)" clip-path="url(#sl-right)">
    <rect x="36" y="36" width="184" height="184" rx="35" fill="url(#sl-blue)"/>
    <rect x="36" y="36" width="184" height="184" rx="35" fill="url(#sl-sheen)"/>
    <polygon points="74,76.9 182,76.9 182,87.1 128,113.7 74,87.1" fill="#f2f8ff" stroke="#f2f8ff" stroke-width="4.9" stroke-linejoin="round"/>
  </g>
</svg>
